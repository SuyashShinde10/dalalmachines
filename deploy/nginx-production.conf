# ==============================================================================
# Dalal Machine Tools Agency Pvt. Ltd. - Production Enterprise Nginx Config
# Architecture: Route Cloaking, Reverse Proxy, Zero-Trust Shield, WebSocket Hub
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-Force Mitigation)
limit_req_zone $binary_remote_addr zone=general_rate_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream Node.js + Socket.IO Server Pool
upstream dalal_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP to HTTPS Strict Redirect
server {
    listen 80;
    listen [::]:80;
    server_name dalalmachines.com www.dalalmachines.com;
    
    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dalalmachines.com www.dalalmachines.com;

    # SSL / TLS Modern Hardening (A+ Rating on SSL Labs)
    ssl_certificate /etc/letsencrypt/live/dalalmachines.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalalmachines.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Hide Nginx Version Signature
    server_tokens off;

    # Restore Real Client IP behind Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. HONEYPOT TRAPS: Deceive automated bots and scanners
    # --------------------------------------------------------------------------
    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git|phpmyadmin|cpanel|administrator) {
        # Drop connection immediately or proxy to Node.js honeypot handler
        proxy_pass http://dalal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. WEB SOCKETS PROXY: Socket.IO Duplex Real-Time Engine
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://dalal_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. ADMINISTRATIVE & DEVELOPER PANELS:
    # Cloaked by Node.js Route Shield as HTTP 404 to all unauthorized visitors
    # --------------------------------------------------------------------------
    location ~* ^/(admin|superadmin|dev|portal-gate) {
        # Zero-Cache Enforced
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        limit_req zone=auth_rate_limit burst=10 nodelay;

        proxy_pass http://dalal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. REST APIs: Rate limited and protected
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=general_rate_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://dalal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. PUBLIC WEBSITE & STATIC ASSETS
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_rate_limit burst=50 nodelay;

        proxy_pass http://dalal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
