<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Executive Console | Dalal Machine Tools Agency Pvt. Ltd.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/new/dalalmachine/images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/new/dalalmachine/css/font-awesome.css">
  <link rel="stylesheet" href="css/superadmin.css?v=2.2">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
                  radial-gradient(at 85% 85%, rgba(245, 158, 11, 0.06) 0px, transparent 50%),
                  #f6f8fc;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    .sa-login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.03);
    }
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .sa-login-card {
        padding: 26px 18px;
        border-radius: 18px;
      }
    }
    .sa-login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .sa-login-logo {
      height: 36px;
      margin-bottom: 14px;
      object-fit: contain;
    }
    .sa-login-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.4px;
    }
    .sa-login-sub {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.6px;
      font-weight: 800;
      color: #4338ca;
      background: #e0e7ff;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-top: 8px;
    }
    .sa-security-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 22px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="sa-login-card">
    <div class="sa-login-header">
      <img src="/new/dalalmachine/images/logo-dalal.png" alt="Dalal Machine Tools" class="sa-login-logo">
      <div class="sa-login-title">Master Executive Console</div>
      <div class="sa-login-sub">Governance & System Telemetry</div>
    </div>

    <div class="sa-security-notice">
      <i class="fa fa-shield" style="color: #6366f1; font-size: 16px; flex-shrink: 0;"></i>
      <span>Restricted Area. Authorized administrative personnel only. Cryptographically audited.</span>
    </div>

    <div id="sa-alert" style="display: none; padding: 12px 14px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; font-weight: 600;"></div>

    <form id="sa-login-form">
      <div class="sa-form-group" style="margin-bottom: 18px;">
        <label class="sa-form-label" for="sa-input-id">Super Admin Identifier</label>
        <input type="text" id="sa-input-id" class="sa-form-control" placeholder="developer" required autofocus autocomplete="username" value="developer">
      </div>

      <div class="sa-form-group" style="margin-bottom: 24px;">
        <label class="sa-form-label" for="sa-input-pw">Master Key / Password</label>
        <div style="position: relative;">
          <input type="password" id="sa-input-pw" class="sa-form-control" placeholder="••••••••••••" required autocomplete="current-password" value="Developer@2026">
          <button type="button" id="sa-toggle-pw" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--sa-text-dim); cursor: pointer;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="sa-btn-submit" class="sa-btn sa-btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px;">
        <i class="fa fa-lock"></i>
        <span>Authenticate & Enter Console</span>
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid #edf2f7; display: flex; justify-content: space-between; font-size: 12.5px;">
      <a href="/admin/index.html" style="color: #64748b; text-decoration: none; font-weight: 600;">&larr; Staff Operations Portal</a>
      <a href="/new/dalalmachine/index.html" target="_blank" style="color: #6366f1; text-decoration: none; font-weight: 700;">Public Site &rarr;</a>
    </div>
  </div>

  <script src="js/superadmin-core.js"></script>
  <script>
    const existing = SuperAdminCore.getUser();
    if (SuperAdminCore.getToken() && existing && existing.role === 'superadmin') {
      window.location.href = '/superadmin/dashboard.html';
    }

    const form = document.getElementById('sa-login-form');
    const idInput = document.getElementById('sa-input-id');
    const pwInput = document.getElementById('sa-input-pw');
    const submitBtn = document.getElementById('sa-btn-submit');
    const alertBox = document.getElementById('sa-alert');
    const togglePw = document.getElementById('sa-toggle-pw');

    togglePw.addEventListener('click', () => {
      const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwInput.setAttribute('type', type);
      togglePw.innerHTML = type === 'password' ? '<i class="fa fa-eye"></i>' : '<i class="fa fa-eye-slash"></i>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Verifying Master Credentials...';

      try {
        const res = await SuperAdminCore.api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            identifier: idInput.value.trim(),
            password: pwInput.value
          })
        });

        if (res.success && res.token && res.user) {
          if (res.user.role !== 'superadmin') {
            showError('Access Denied: Account lacks Super Admin executive privileges.');
            return;
          }
          SuperAdminCore.setSession(res.token, res.user);
          alertBox.style.display = 'block';
          alertBox.style.background = '#ecfdf5';
          alertBox.style.color = '#047857';
          alertBox.style.border = '1px solid #d1fae5';
          alertBox.textContent = 'Master authorization granted. Launching console...';
          setTimeout(() => {
            window.location.href = '/superadmin/dashboard.html';
          }, 400);
        } else {
          showError(res.message || 'Invalid super admin credentials.');
        }
      } catch (err) {
        showError('Network error connecting to master authority.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-lock"></i> Authenticate & Enter Console';
      }
    });

    function showError(msg) {
      alertBox.style.display = 'block';
      alertBox.style.background = '#fef2f2';
      alertBox.style.color = '#b91c1c';
      alertBox.style.border = '1px solid #fee2e2';
      alertBox.textContent = msg;
    }
  </script>
</body>
</html>
