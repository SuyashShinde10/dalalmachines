<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Operations Portal | Dalal Machine Tools Agency Pvt. Ltd.</title>
  <link rel="shortcut icon" href="/new/Machinery/images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/new/Machinery/css/font-awesome.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: radial-gradient(circle at 50% 15%, rgba(248, 157, 19, 0.06) 0%, transparent 60%),
                  #0c1017;
    }
    .staff-login-box {
      width: 100%;
      max-width: 420px;
      background: #131924;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid var(--brand-gold);
      border-radius: var(--radius-md);
      padding: 38px 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .staff-login-header {
      text-align: center;
      margin-bottom: 26px;
    }
    .staff-logo-img {
      max-height: 38px;
      width: auto;
      margin-bottom: 12px;
      object-fit: contain;
    }
    .staff-brand-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .staff-brand-badge {
      display: inline-block;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: var(--brand-gold);
      background: rgba(248, 157, 19, 0.1);
      border: 1px solid rgba(248, 157, 19, 0.25);
      padding: 3px 10px;
      border-radius: 9999px;
      margin-top: 6px;
    }
    .staff-helper-note {
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="staff-login-box">
    <div class="staff-login-header">
      <img src="/new/Machinery/images/logo-dalal-light.png" alt="Dalal Machine Tools" class="staff-logo-img">
      <div class="staff-brand-title">STAFF OPERATIONS PORTAL</div>
      <div class="staff-brand-badge">Inventory & Customer Leads Management</div>
    </div>

    <div id="login-alert" style="display: none; padding: 12px 14px; border-radius: 6px; margin-bottom: 20px; font-size: 13px;"></div>

    <form id="login-form">
      <div style="margin-bottom: 18px;">
        <label class="form-label" for="input-identifier">Staff Username / Email</label>
        <input type="text" id="input-identifier" class="form-control" placeholder="admin@dalalmachines.com" required autofocus autocomplete="username" value="admin">
      </div>

      <div style="margin-bottom: 24px;">
        <label class="form-label" for="input-password">Password</label>
        <div style="position: relative;">
          <input type="password" id="input-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" value="Dalal@Admin2026">
          <button type="button" id="btn-toggle-pw" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
        <i class="fa fa-sign-in"></i>
        <span>Sign In to Operations</span>
      </button>
    </form>

    <div class="staff-helper-note">
      <span>Master Executive Access?</span>
      <a href="/superadmin/index.html" style="color: var(--brand-gold); font-weight: 600; text-decoration: none;">Super Admin Portal &rarr;</a>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 12px;">
      <a href="/new/Machinery/index.html" target="_blank" style="color: var(--text-muted); text-decoration: none;">&larr; View Customer Website</a>
    </div>
  </div>

  <script src="js/admin-core.js"></script>
  <script>
    if (AdminCore.getToken() && AdminCore.getUser()) {
      window.location.href = '/admin/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const idInput = document.getElementById('input-identifier');
    const pwInput = document.getElementById('input-password');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('btn-submit');
    const togglePw = document.getElementById('btn-toggle-pw');

    togglePw.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      togglePw.querySelector('i').className = isPw ? 'fa fa-eye-slash' : 'fa fa-eye';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-circle-o-notch fa-spin"></i> Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: idInput.value.trim(),
            password: pwInput.value
          })
        });

        const data = await res.json();
        if (data.success) {
          AdminCore.setSession(data.token, data.user);
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.border = '1px solid #10b981';
          alertBox.style.color = '#34d399';
          alertBox.textContent = `Welcome, ${data.user.name}. Entering Operations Portal...`;
          setTimeout(() => {
            window.location.href = '/admin/dashboard.html';
          }, 500);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.border = '1px solid #ef4444';
          alertBox.style.color = '#f87171';
          alertBox.textContent = data.message || 'Login failed. Please verify credentials.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa fa-sign-in"></i> <span>Sign In to Operations</span>';
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.border = '1px solid #ef4444';
        alertBox.style.color = '#f87171';
        alertBox.textContent = 'Server connection error. Ensure backend server is active.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-sign-in"></i> <span>Sign In to Operations</span>';
      }
    });
  </script>
</body>
</html>
